name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/sa-key.json
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json
          dvc remote modify labstore credentialpath /tmp/sa-key.json

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          from google.cloud import storage
          from google.oauth2 import service_account
          import os

          credentials = service_account.Credentials.from_service_account_file(
              '/tmp/sa-key.json',
              scopes=['https://www.googleapis.com/auth/devstorage.read_write']
          )
          bucket_name = os.environ.get('ARTIFACT_BUCKET', 'lab-day21-vinai')
          client = storage.Client(credentials=credentials)
          bucket = client.bucket(bucket_name)
          blob = bucket.blob('artifacts/current/model.joblib')
          blob.upload_from_filename('models/model.joblib')
          print(f'Model uploaded to gs://{bucket_name}/artifacts/current/model.joblib')
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import os
          f1 = float("${{ needs.train.outputs.f1 }}")
          print(f"F1 score: {f1:.4f}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("PASSED: F1 >= 0.65, tiep tuc trien khai.")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.STORAGE_CREDENTIALS }}

      - name: Deploy to VM
        run: |
          gcloud compute ssh income-api --zone=asia-southeast1-a --project=vinai-lab --command="sudo systemctl restart income-api && sleep 10 && curl -sf http://localhost:8080/healthz && echo 'Deployment successful'"
